const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function load(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def}catch(e){return def}}
function save(key,val){localStorage.setItem(key,JSON.stringify(val))}
let sessions=load(KEYS.sessions,[]), measures=load(KEYS.measures,[]), settings=load(KEYS.settings,{goalWeight:""}), overrides=load(KEYS.overrides,{}), pending=load(KEYS.pending,[]);
if(!Array.isArray(sessions))sessions=[];if(!Array.isArray(measures))measures=[];if(!Array.isArray(pending))pending=[];
let currentTab="home",selectedWorkout=1,timerInt=null,timerLeft=0,chartLift="Smith bench press";
function localDate(d=new Date()){const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function dateFromKey(k){return new Date(k+"T12:00:00")}
function monday(k){const d=dateFromKey(k);d.setDate(d.getDate()-(d.getDay()+6)%7);return localDate(d)}
function currentWeek(){const start=monday(localDate());const d=dateFromKey(start);return Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(x.getDate()+i);return localDate(x)})}
function weekSessions(){const days=currentWeek();return sessions.filter(s=>days.includes(s.date))}
function fmt(n){return Math.round(n).toLocaleString("en-US")}
function allExercises(){return PROGRAM.flatMap(w=>w.exercises.map(e=>({name:e[0],group:e[3],workout:w.name})))}
function e1rm(weight,reps){if(!weight||!reps||reps>12)return null;return weight*(1+reps/30)}
function totalVol(s){return (s.exercises||[]).reduce((a,e)=>a+(Number(e.weight)||0)*(Number(e.reps)||0)*(Number(e.sets)||0),0)}
function sessionsForLift(name){return sessions.map(s=>({...s,entry:(s.exercises||[]).find(e=>e.name===name)})).filter(s=>s.entry)}
function legacyStatus(){return LEGACY.map(k=>{let raw=localStorage.getItem(k);let count=0;if(raw){try{let p=JSON.parse(raw);count=Array.isArray(p)?p.length:(p&&typeof p==="object"?Object.keys(p).length:1)}catch(e){count=1}}return {key:k,exists:raw!==null,count}})}
function legacyNotice(){const l=legacyStatus().filter(x=>x.exists);return l.length?`Legacy data detected and preserved: ${l.map(x=>x.key+" ("+x.count+")").join(", ")}. Older entries may not contain dates, so they are kept separate from V2 weekly analytics.`:"No legacy workout keys were found in this browser. If you used the previous app, open V2 on the same GitHub Pages address and import a backup if needed."}
function setTab(tab){currentTab=tab;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));render()}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
function stat(label,value,sub){return `<div class="card stat"><span>${label}</span><strong>${value}</strong><span>${sub||""}</span></div>`}
function streakDays(){const days=[...new Set(sessions.map(s=>s.date))].sort().reverse();if(!days.length)return 0;let d=dateFromKey(days[0]),today=dateFromKey(localDate());if((today-d)/86400000>1)return 0;let n=0;for(let i=0;i<days.length;i++){let expected=new Date(d);expected.setDate(expected.getDate()-i);if(localDate(expected)===days[i])n++;else break}return n}
function renderHome(){
 const ws=weekSessions(),vol=ws.reduce((a,s)=>a+totalVol(s),0),streak=streakDays(),days=currentWeek();
 const cal=days.map((d,i)=>{const done=ws.some(s=>s.date===d);return `<div class="day ${done?"done":""} ${d===localDate()?"today":""}"><b>${["M","T","W","T","F","S","S"][i]}</b><span>${d.slice(8)}</span><span>${done?"✓": "—"}</span></div>`}).join("");

 return `<h2>Dashboard</h2><p class="muted small">Your training at a glance. New V2 analytics use dated sessions only.</p>

 <section class="card"><div class="row"><h3>This week</h3><span class="pill green">${localDate()}</span></div><div class="calendar">${cal}</div><p class="tiny">A day is marked when a dated V2 session is completed. Rest days are fine—use the streak as a consistency indicator, not a score.</p></section>

}

 const w=PROGRAM.find(x=>x.id===Number(selectedWorkout))||PROGRAM[0];
 const opts=PROGRAM.map(x=>`<option value="${x.id}" ${x.id===w.id?"selected":""}>Day ${x.id} · ${esc(x.name)}</option>`).join("");

   if(weight>0&&reps>=high&&sets>=3){recs.push({id:"r"+Date.now()+Math.random(),exercise:e.name,kind:"load",sets,reps,weight:Math.round((weight+(e.group==="Quads"||e.group==="Hamstrings"?5:2.5))*2)/2,newWeight:Math.round((weight+(e.group==="Quads"||e.group==="Hamstrings"?5:2.5))*2)/2,reason:`You logged ${sets} sets of ${reps} reps at ${weight} lb, at or above the top of the target range. Try a small load increase next time if reps were clean.`});}

 return `<h2>History & backup</h2><p class="muted small">V2 dated workout history and full-device backup tools.</p><section class="card"><h3>Backup before replacing the old app</h3><div class="notice warn">Export your backup from the currently deployed app before replacing index.html. This V2 export includes legacy Saude Strength keys found in this browser plus V2 records.</div><div class="row wrap"><button onclick="exportBackup()">Export backup JSON</button><label class="btn secondary" style="display:inline-block;cursor:pointer">Restore backup<input type="file" id="restoreFile" accept=".json,application/json" style="display:none" onchange="importBackup(event)"></label></div><p class="tiny">Restore merges keys from a Saude Strength backup after confirmation. Keep a second copy of the JSON file somewhere safe.</p></section>

 <section class="card"><h3>Legacy data check</h3>${legacyStatus().map(x=>`<div class="listitem row"><span class="small">${esc(x.key)}</span><b>${x.exists?"Found · "+x.count:"Not found"}</b></div>`).join("")}<p class="tiny">Legacy data is not deleted or rewritten. Undated legacy logs are not counted in V2 weekly totals or charts.</p></section>
 <section class="card"><h3>Data stored on this iPhone/browser</h3><p class="small muted">Workout and body entries are saved in Safari localStorage. Clearing Safari website data, changing the website origin, or opening the app in a different browser can make this data unavailable. Use the same GitHub Pages address and export backups regularly.</p></section>`;
}
function exportBackup(){const storage={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.toLowerCase().includes("saudestrength"))storage[k]=localStorage.getItem(k)}const payload={app:"Saude Strength",version:2,exportedAt:new Date().toISOString(),storage};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="saude-strength-backup-"+localDate()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function importBackup(ev){const f=ev.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data.storage||typeof data.storage!=="object")throw new Error("Not a Saude Strength backup");if(!confirm("Restore this backup? Matching Saude Strength keys on this device will be replaced. Export a backup of the current app first."))return;Object.entries(data.storage).forEach(([k,v])=>{if(k.toLowerCase().includes("saudestrength"))localStorage.setItem(k,String(v))});sessions=load(KEYS.sessions,[]);measures=load(KEYS.measures,[]);settings=load(KEYS.settings,{});overrides=load(KEYS.overrides,{});pending=load(KEYS.pending,[]);alert("Backup restored.");setTab("home")}catch(e){alert("Could not restore backup: "+e.message)}finally{ev.target.value=""}};reader.readAsText(f)}
function render(){const app=$("#app");if(currentTab==="home")app.innerHTML=renderHome();if(currentTab==="train")app.innerHTML=renderTrain();if(currentTab==="strength"){app.innerHTML=renderStrength();setTimeout(drawStrengthChart,30)}if(currentTab==="body"){app.innerHTML=renderBody();setTimeout(drawBodyChart,30)}if(currentTab==="coach")app.innerHTML=renderCoach();if(currentTab==="history")app.innerHTML=renderHistory()}
window.addEventListener("resize",()=>{if(currentTab==="strength")drawStrengthChart();if(currentTab==="body")drawBodyChart()});
render();
</script>
