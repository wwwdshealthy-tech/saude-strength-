<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151f">
<title>Saude Strength</title>
<style>
:root{color-scheme:dark;--bg:#10151f;--panel:#1b2636;--line:#344155;--muted:#aab5c5;--accent:#d7f36a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f5f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:24px 18px;background:#192333;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:28px;letter-spacing:-1px}h1 span{color:var(--accent)}
header p{color:var(--muted);font-size:13px;margin:6px 0 0}
main{max-width:700px;margin:auto;padding:15px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:14px}
.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
h2{font-size:19px;margin:8px 0}
select,input{background:#101a29;color:white;border:1px solid #40506a;border-radius:9px;padding:11px;font-size:15px}
select{width:100%;margin-top:10px}
button{background:var(--accent);color:#18200d;border:0;border-radius:9px;padding:12px 15px;font-weight:800;font-size:14px;cursor:pointer}
button.secondary{background:#354258;color:white}
button:active{opacity:.75}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:12px}
.big{font-size:30px;font-weight:850}
.progress{height:8px;background:#354258;border-radius:10px;margin:12px 0;overflow:hidden}
.progress div{height:100%;background:var(--accent);width:0;transition:width .2s}
.exercise{padding:14px 0;border-bottom:1px solid var(--line)}
.exercise:last-child{border:0}
.exercisehead{display:flex;gap:10px;align-items:center}
.exercisehead input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);padding:0}
.exname{font-weight:750;flex:1;font-size:14px}
.detail{font-size:12px;color:var(--muted);margin:5px 0 0 30px}
.logs{display:flex;gap:8px;margin:10px 0 0 30px}
.logs input{width:50%;min-width:0;font-size:13px;padding:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1}
.timer{text-align:center;font-size:45px;font-weight:850;margin:10px}
.historyitem{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.historyitem:last-child{border:0}
footer{text-align:center;color:#8290a4;font-size:11px;padding:20px}
.smallbtn{padding:7px 10px;font-size:12px}
</style>
</head>
<body>
<header>
<h1>SAUDE <span>STRENGTH</span></h1>
<p>Train hard. Track progress. Get stronger.</p>
</header>
<main>
<section class="panel">
<div class="label">Your 8-day training cycle</div>
<select id="daySelect" aria-label="Choose workout day"></select>
<div class="row" style="margin-top:12px">
<strong id="dayName">Push</strong><span class="muted" id="dayNumber">Day 1 of 8</span>
</div>
<div class="progress"><div id="progressBar"></div></div>
<div class="row muted"><span id="doneCount">0 completed</span><span id="percent">0%</span></div>
</section>

<section class="panel">
<div class="label">Today's workout</div>
<h2 id="workoutTitle">Push</h2>
<div id="exerciseList"></div>
<div class="actions">
<button id="finishBtn">Finish workout</button>
<button class="secondary" id="resetBtn">Reset day</button>
</div>
</section>

<section class="panel">
<div class="label">Rest timer</div>
<div class="timer" id="timerDisplay">01:30</div>
<div class="actions">
<button data-seconds="60">60 sec</button>
<button data-seconds="90">90 sec</button>
<button data-seconds="120">2 min</button>
<button class="secondary" id="stopTimer">Stop</button>
</div>
</section>

<section class="panel">
<div class="row">
<div><div class="label">Training history</div><strong>Completed workouts</strong></div>
<div class="big" id="totalWorkouts">0</div>
</div>
<div id="historyList" style="margin-top:10px"></div>
</section>
<footer>SAUDE STRENGTH · BUILT FOR YOUR PROGRESS</footer>
</main>

<script>
const workouts = [
 {name:"Push",focus:"Chest · Shoulders · Triceps",items:[
  ["Smith Machine Bench Press","4 sets × 6–8 reps"],
  ["Incline Dumbbell Press","3 × 8–10"],
  ["Smith Machine Shoulder Press","3 × 8–10"],
  ["Cable Lateral Raise","3 × 12–15 + drop set"],
  ["Cable Fly","3 × 10–15"],
  ["Overhead Cable Triceps Extension","3 × 10–15"],
  ["Dips","2 sets near failure"],
  ["Push-up Finisher","1 set near failure"]]},
 {name:"Pull",focus:"Back · Lats · Rear delts · Biceps",items:[
  ["Pull-ups","4 × 6–10"],
  ["Landmine Row","4 × 8–10"],
  ["Single-arm Cable Lat Pulldown","3 × 10–12 each side"],
  ["Single-arm Cable Row","3 × 8–12 each side"],
  ["Cable Rear-delt Fly","3 × 12–15"],
  ["Dumbbell Hammer Curl","3 × 10–12"],
  ["Dumbbell or Barbell Curl","3 × 10–12"]]},
 {name:"Legs + Abs",focus:"Quads · Hamstrings · Glutes · Core",items:[
  ["Smith Machine Squat","4 × 6–10"],
  ["Dumbbell Romanian Deadlift","4 × 8–10"],
  ["Bulgarian Split Squat","3 × 8–10 each leg"],
  ["Dumbbell Step-ups","3 × 10 each leg"],
  ["Standing Calf Raise","4 × 12–15"],
  ["Goblet Squat","2 × 15"],
  ["Cable Crunch","3 × 15"],
  ["Hanging Knee Raise","3 × 12"]]},
 {name:"Dumbbell Circuit A",focus:"Full-body conditioning · 4 rounds",items:[
  ["Dumbbell Thrusters","10–12 reps"],
  ["Bent-over Dumbbell Row","12 reps"],
  ["Reverse Lunges","10 each leg"],
  ["Dumbbell Floor Press","12 reps"],
  ["Dumbbell Romanian Deadlift","12 reps"],
  ["Dumbbell Lateral Raise","12–15 reps"],
  ["Hammer Curls","12 reps"],
  ["Circuit target","Complete 4 rounds; rest 90–120 sec between rounds"]]},
 {name:"Full Body A — Heavy",focus:"Full-body strength",items:[
  ["Smith Machine Squat","4 × 6–8"],
  ["Smith Machine Bench Press","4 × 6–8"],
  ["Pull-ups","4 × 6–10"],
  ["Landmine Row","3 × 8–10"],
  ["Dumbbell Romanian Deadlift","3 × 8–10"],
  ["Cable Lateral Raise","3 × 12–15"],
  ["Cable Triceps Extension","3 × 10–12"],
  ["Dumbbell Curl","3 × 10–12"]]},
 {name:"Full Body B — Hypertrophy",focus:"Full-body muscle building",items:[
  ["Smith Machine Squat","3 × 10–12"],
  ["Incline Dumbbell Press","3 × 10–12"],
  ["Single-arm Landmine Row","3 × 10 each side"],
  ["Cable Lat Pulldown","3 × 10–12"],
  ["Cable Rear-delt Fly","3 × 15"],
  ["Dumbbell Lateral Raise","3 × 15"],
  ["Hammer Curl","3 × 12"],
  ["Overhead Cable Triceps Extension","3 × 12"]]},
 {name:"Dumbbell Circuit B",focus:"Full-body conditioning · 4 rounds",items:[
  ["Dumbbell Push Press","10 reps"],
  ["Renegade Rows","8 each side"],
  ["Goblet Squat","12 reps"],
  ["Walking Lunges","10 each leg"],
  ["Push-up Rows","8–10 reps"],
  ["Farmer Carry","30–45 seconds"],
  ["Weighted Sit-ups","15 reps"],
  ["Circuit target","Complete 4 rounds; rest 90–120 sec between rounds"]]},
 {name:"Recovery",focus:"Rest · Mobility · Walking",items:[
  ["Easy walk","20–30 minutes"],
  ["Hip mobility","5 minutes"],
  ["Shoulder mobility","5 minutes"],
  ["Light stretching","5–10 minutes"],
  ["Recovery focus","Hydration and sleep"]]}
];

const $ = id => document.getElementById(id);
const safeRead = (key, fallback) => {
 try { const value = localStorage.getItem(key); return value ? JSON.parse(value) : fallback; }
 catch(e) { return fallback; }
};
let logs = safeRead("saudeStrengthLogs",{});
let history = safeRead("saudeStrengthHistory",[]);
let currentDay = Number(localStorage.getItem("saudeStrengthDay") || 0);
let timerInterval = null;
let remaining = 90;

workouts.forEach((workout,index)=>{
 const option=document.createElement("option");
 option.value=index;
 option.textContent="Day "+(index+1)+" — "+workout.name;
 $("daySelect").appendChild(option);
});
currentDay=Math.max(0,Math.min(7,currentDay));
$("daySelect").value=String(currentDay);

function saveLogs(){localStorage.setItem("saudeStrengthLogs",JSON.stringify(logs));}
function keyFor(day,index){return day+"-"+index;}
function render(){
 currentDay=Number($("daySelect").value);
 localStorage.setItem("saudeStrengthDay",String(currentDay));
 const workout=workouts[currentDay];
 $("dayName").textContent=workout.name;
 $("dayNumber").textContent="Day "+(currentDay+1)+" of 8";
 $("workoutTitle").textContent=workout.name;
 const list=$("exerciseList");
 list.innerHTML="";
 let completed=0;
 workout.items.forEach((item,index)=>{
  const key=keyFor(currentDay,index);
  const entry=logs[key]||{checked:false,weight:"",reps:""};
  if(entry.checked)completed++;
  const row=document.createElement("div");
  row.className="exercise";
  const head=document.createElement("div");
  head.className="exercisehead";
  const check=document.createElement("input");
  check.type="checkbox";check.checked=!!entry.checked;
  check.setAttribute("aria-label","Mark "+item[0]+" complete");
  check.addEventListener("change",()=>{
   const old=logs[key]||{};
   logs[key]={...old,checked:check.checked};saveLogs();render();
  });
  const name=document.createElement("div");
  name.className="exname";name.textContent=item[0];
  head.append(check,name);
  const detail=document.createElement("div");
  detail.className="detail";detail.textContent=item[1];
  const fields=document.createElement("div");
  fields.className="logs";
  const weight=document.createElement("input");
  weight.type="text";weight.inputMode="decimal";weight.placeholder="Weight";
  weight.value=entry.weight||"";
  weight.setAttribute("aria-label",item[0]+" weight");
  const reps=document.createElement("input");
  reps.type="text";reps.inputMode="numeric";reps.placeholder="Reps";
  reps.value=entry.reps||"";
  reps.setAttribute("aria-label",item[0]+" reps");
  weight.addEventListener("change",()=>{logs[key]={...(logs[key]||{}),weight:weight.value};saveLogs();});
  reps.addEventListener("change",()=>{logs[key]={...(logs[key]||{}),reps:reps.value};saveLogs();});
  fields.append(weight,reps);
  row.append(head,detail,fields);
  list.appendChild(row);
 });
 const pct=Math.round(completed/workout.items.length*100);
 $("doneCount").textContent=completed+" of "+workout.items.length+" completed";
 $("percent").textContent=pct+"%";
 $("progressBar").style.width=pct+"%";
}
function resetDay(){
 if(!confirm("Reset all checks and entries for this workout day?"))return;
 workouts[currentDay].items.forEach((_,i)=>delete logs[keyFor(currentDay,i)]);
 saveLogs();render();
}
function finishWorkout(){
 const workout=workouts[currentDay];
 const completed=workout.items.filter((_,i)=>(logs[keyFor(currentDay,i)]||{}).checked).length;
 if(!confirm("Save "+workout.name+" to your workout history?"))return;
 history.unshift({name:workout.name,date:new Date().toLocaleString(),completed:completed,total:workout.items.length});
 localStorage.setItem("saudeStrengthHistory",JSON.stringify(history));
 renderHistory();
 if(currentDay<7){$("daySelect").value=String(currentDay+1);render();}
}
function renderHistory(){
 $("totalWorkouts").textContent=history.length;
 const area=$("historyList");area.innerHTML="";
 if(!history.length){area.innerHTML='<div class="muted">Your completed workouts will appear here.</div>';return;}
 history.slice(0,30).forEach(item=>{
  const row=document.createElement("div");row.className="historyitem";
  const strong=document.createElement("strong");strong.textContent=item.name;
  const detail=document.createElement("div");detail.className="muted";
  detail.textContent=item.date+" · "+item.completed+"/"+item.total+" exercises checked";
  row.append(strong,detail);area.appendChild(row);
 });
}
function showTimer(){
 const m=String(Math.floor(remaining/60)).padStart(2,"0");
 const s=String(remaining%60).padStart(2,"0");
 $("timerDisplay").textContent=m+":"+s;
}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}}
function startTimer(seconds){
 stopTimer();remaining=seconds;showTimer();
 timerInterval=setInterval(()=>{
  remaining--;showTimer();
  if(remaining<=0){stopTimer();$("timerDisplay").textContent="DONE";if(navigator.vibrate)navigator.vibrate([200,100,200]);}
 },1000);
}
$("daySelect").addEventListener("change",render);
$("resetBtn").addEventListener("click",resetDay);
$("finishBtn").addEventListener("click",finishWorkout);
$("stopTimer").addEventListener("click",stopTimer);
document.querySelectorAll("[data-seconds]").forEach(button=>button.addEventListener("click",()=>startTimer(Number(button.dataset.seconds))));
render();renderHistory();showTimer();
</script>
</body>
</html>
